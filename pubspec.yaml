name: tava
description: Practice journal and metronome for musicians.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  audio_session: ^0.2.4
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.3.0
  equatable: ^2.1.0
  fl_chart: ^1.2.0
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  fpdart: ^1.2.0
  geolocator: ^14.1.1
  get_it: ^8.3.0
  go_router: ^16.1.0
  google_fonts: ^6.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  injectable: ^2.7.1+4
  intl: ^0.20.2
  just_audio: ^0.10.6
  logger: ^2.8.0
  lottie: ^3.6.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.0
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.5.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.7.1
  mocktail: ^1.0.5
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/tava_mark_ios.png
  adaptive_icon_background: "#0B6E75"
  adaptive_icon_foreground: assets/brand/tava_mark.png
  remove_alpha_ios: true
